<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>向作者提问 - 筱乜的咒法学书库</title>
<style>
  body { font-family:system-ui,"Microsoft YaHei",sans-serif; color:#e8e6e3; max-width:760px; margin:0 auto; padding:40px 20px;
    background: linear-gradient(rgba(10,12,16,.55), rgba(10,12,16,.55)), url('./xm.png') center / contain no-repeat fixed, #0f1115; }
  .back { display:inline-block; margin-bottom:14px; color:#a89bff; text-decoration:none; font-size:.9em; }
  .back:hover { text-decoration:underline; }
  h1 { font-size:1.6em; color:#a89bff; margin:0 0 8px; }
  .hint { font-size:.9em; color:#9aa0ab; margin:0 0 20px; }
  .card { border:1px solid #2a2e37; border-radius:12px; padding:24px; background:#161922; }
  label { display:block; margin:16px 0 6px; font-size:.95em; color:#c9cede; }
  input, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #2a2e37; border-radius:8px; background:#0f1115; color:#e8e6e3; font:inherit; }
  input:focus, textarea:focus { outline:none; border-color:#7a6cff; }
  button { margin-top:22px; font-family:inherit; font-size:1em; color:#fff; background:#7a6cff; border:none; border-radius:999px; padding:12px 36px; cursor:pointer; transition:filter .15s; }
  button:hover { filter:brightness(1.12); }
  button:disabled { opacity:.6; cursor:default; }
  #msg { margin-top:14px; font-size:.95em; }
  #msg.ok { color:#7ee787; }
  #msg.err { color:#ff7b72; }
</style>
</head>
<body>
  <a class="back" href="./">← 返回书库</a>
  <h1>向作者提问</h1>
  <p class="hint">写下你的咒法学问题，提交后会自动发邮件转达给作者。可以留下联系方式方便作者回复。</p>
  <div class="card">
    <form action="https://formsubmit.co/public@xm1221.cn" method="POST" id="askForm">
      <input type="hidden" name="_subject" value="[hexbook] 咒法学提问" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_next" value="./ask.html?sent=1" />
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />
      <label>昵称（可选）</label>
      <input type="text" name="昵称" maxlength="40" placeholder="怎么称呼你" />
      <label>你的问题 *</label>
      <textarea name="问题内容" rows="6" required maxlength="2000" placeholder="描述你的问题……"></textarea>
      <label>你的邮箱（可选，方便作者回复）</label>
      <input type="email" name="联系邮箱" placeholder="you@example.com" />
      <button type="submit">✉ 提交问题</button>
    </form>
    <div id="msg"></div>
  </div>
<script>
  if (new URLSearchParams(location.search).get('sent')) {
    document.getElementById('msg').innerHTML = '✅ 问题已提交，邮件已转达给作者，谢谢！';
    document.getElementById('msg').className = 'ok';
    document.getElementById('askForm').style.display = 'none';
  }
  document.getElementById('askForm').addEventListener('submit', function () {
    var btn = this.querySelector('button');
    btn.disabled = true;
    btn.textContent = '提交中…';
  });
</script>
</body>
</html>
