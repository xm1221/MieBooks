<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>筱乜的咒法学书库</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; color:#e8e6e3; max-width:760px; margin:0 auto; padding:40px 20px;
    background: linear-gradient(rgba(10,12,16,.55), rgba(10,12,16,.55)), url('./xm.png') center / contain no-repeat fixed, #0f1115; }
  h1 { font-size:1.8em; }
  .card { display:flex; align-items:center; gap:16px; border:1px solid #2a2e37; border-radius:12px; padding:16px 22px; margin:14px 0; text-decoration:none; color:#e8e6e3; background:#161922; transition:border-color .15s; }
  .card:hover { border-color:#7a6cff; }
  .card .icon { width:52px; height:52px; border-radius:10px; flex:none; image-rendering:pixelated; }
  .card h2 { margin:0 0 4px; font-size:1.15em; color:#a89bff; }
  .card p { margin:0; font-size:.92em; color:#9aa0ab; }
  .tag { display:inline-block; font-size:.78em; padding:2px 8px; border-radius:999px; background:#262b38; color:#c9cede; margin-left:8px; vertical-align:middle; }
  #cover { position:fixed; inset:0; z-index:10; background:#0f1115 url('./xm.png') center / contain no-repeat; display:flex; align-items:flex-end; justify-content:center; padding-bottom:56px; cursor:pointer; transition:opacity .6s ease; }
  #cover.hide { opacity:0; pointer-events:none; }
  #enterBtn { font-family:inherit; font-size:1.05em; color:#e8e6e3; background:rgba(20,22,32,.72); border:1px solid #7a6cff; border-radius:999px; padding:12px 38px; cursor:pointer; transition:background .15s, transform .15s; }
  #enterBtn:hover { background:#7a6cff; color:#fff; transform:translateY(-2px); }
</style>
</head>
<body>
  <div id="cover" role="button" aria-label="进入书库">
    <button id="enterBtn">✦ 进入书库 ✦</button>
  </div>
  <h1>筱乜的咒法学书库</h1>
  <p>以下为筱乜的咒法学模组网页书。</p>
  <a class="card" href="./miehex-revolution/">
    <img class="icon" src="./icons/miehex-revolution.png" alt="MieHex:Revolution" />
    <div>
      <h2>MieHex:Revolution <span class="tag">咒法学附属</span></h2>
      <p>咩之咒法：变革</p>
    </div>
  </a>
  <a class="card" href="./abadoned-greatwork/">
    <img class="icon" src="./icons/abadoned-greatwork.png" alt="Abadoned Greatwork" />
    <div>
      <h2>Abadoned Greatwork <span class="tag">咒法学附属</span></h2>
      <p>被遗弃的卓伟之作</p>
    </div>
  </a>
  <a class="card" href="./almightly-staff/">
    <img class="icon" src="./icons/almightly-staff.png" alt="Almightly Staff" />
    <div>
      <h2>Almightly Staff <span class="tag">咒法学附属</span></h2>
      <p>万法之杖</p>
    </div>
  </a>
  <a class="card" href="./miehex-for-bigpackage/">
    <img class="icon" src="./icons/miehex.png" alt="miehex" />
    <div>
      <h2>miehex <span class="tag">咒法学</span></h2>
      <p>咩之咒法</p>
    </div>
  </a>
<script>
  function enter() { document.getElementById('cover').classList.add('hide'); }
  document.getElementById('cover').addEventListener('click', enter);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); }
  });
</script>
</body>
</html>
