name: Deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [book-update]

concurrency:
  group: hexbook
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 各 book 仓库（私有仓库需 MIEHEX_REPO_TOKEN secret）
      - name: Checkout MieHexRevolution
        uses: actions/checkout@v5
        with:
          repository: xm1221/MieHexRevolution1.20.1
          path: books/miehex-revolution
          token: ${{ secrets.MIEHEX_REPO_TOKEN || github.token }}

      - name: Checkout AbadonedGreatwork
        uses: actions/checkout@v5
        with:
          repository: xm1221/AbadonedGreatwork
          path: books/abadoned-greatwork
          token: ${{ secrets.MIEHEX_REPO_TOKEN || github.token }}

      - name: Checkout Almightly-Staff
        uses: actions/checkout@v5
        with:
          repository: xm1221/Almightly-Staff
          path: books/almightly-staff
          token: ${{ secrets.MIEHEX_REPO_TOKEN || github.token }}

      - name: Checkout miehex_for_bigpackage
        uses: actions/checkout@v5
        with:
          repository: xm1221/miehex_for_bigpackage
          path: books/miehex-for-bigpackage
          token: ${{ secrets.MIEHEX_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install xvfb (headless GL for hexdoc)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # ---- build each book ----
      - name: Build miehex-revolution
        working-directory: books/miehex-revolution
        run: |
          uv sync
          printf 'GITHUB_REPOSITORY=xm1221/MieHexRevolution1.20.1\nGITHUB_SHA=main\nGITHUB_PAGES_URL=https://hexbook.xm1221.cn/miehex-revolution\n' > .env
          xvfb-run -a uv run hexdoc build
          uv run hexdoc merge

      - name: Build abadoned-greatwork
        working-directory: books/abadoned-greatwork
        run: |
          uv sync
          printf 'GITHUB_REPOSITORY=xm1221/AbadonedGreatwork\nGITHUB_SHA=main\nGITHUB_PAGES_URL=https://hexbook.xm1221.cn/abadoned-greatwork\n' > .env
          xvfb-run -a uv run hexdoc build
          uv run hexdoc merge

      - name: Build almightly-staff
        working-directory: books/almightly-staff
        run: |
          uv sync
          printf 'GITHUB_REPOSITORY=xm1221/Almightly-Staff\nGITHUB_SHA=main\nGITHUB_PAGES_URL=https://hexbook.xm1221.cn/almightly-staff\n' > .env
          xvfb-run -a uv run hexdoc build
          uv run hexdoc merge

      - name: Build miehex-for-bigpackage
        working-directory: books/miehex-for-bigpackage
        run: |
          uv sync
          printf 'GITHUB_REPOSITORY=xm1221/miehex_for_bigpackage\nGITHUB_SHA=main\nGITHUB_PAGES_URL=https://hexbook.xm1221.cn/miehex-for-bigpackage\n' > .env
          xvfb-run -a uv run hexdoc build
          uv run hexdoc merge

      # ---- assemble full site (全量覆盖) ----
      - name: Assemble deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy
          for d in books/*/; do
            slug=$(basename "$d")
            mkdir -p "deploy/$slug"
            cp -r "$d/_site/dst/docs/." "deploy/$slug/"
          done
          # 默认语言改为中文：hexdoc 根跳转 en_us -> zh_cn（书内仍可切换语言）
          for d in deploy/*/; do
            sed -i 's|/en_us"|/zh_cn"|' "$d/index.html"
          done
          cp -r web/. deploy/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ab2343f4691dfe98689e375fc23d4121
          command: pages deploy deploy --project-name hexbook --branch main
